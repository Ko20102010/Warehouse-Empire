<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weapon Shop Empire v0.17.00 Actual Asset Audit</title><style>body{font-family:Arial;background:#171b18;color:#f7edcf;margin:0;padding:18px}.note{background:#2b342c;padding:12px;border:1px solid #8daf72;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}.card{background:#27231f;border:1px solid #765b3b;border-radius:10px;padding:10px}.card img{width:100%;height:120px;object-fit:contain;background:#394a35;image-rendering:pixelated}.ok{color:#9df18f}.pending{color:#ffd071}.file{font-size:11px;word-break:break-all;color:#cdbf9f}</style></head><body><h1>v0.17.00 Actual Asset Audit</h1><div class="note">This page shows real repository PNGs only. It does not use emoji or CSS drawings as substitute assets. Furniture and product artwork not yet created is listed as missing in the audit files.</div><div id="grid" class="grid"></div><script>fetch('metadata/asset_audit.json?v=0.17.00').then(r=>r.json()).then(d=>{grid.innerHTML=d.assets.filter(a=>a.status!=="not-required").map(a=>`<div class="card"><img src="${a.path}" onerror="this.style.display='none'"><b>${a.id}</b><div class="${a.status==='integrated'?'ok':'pending'}">${a.status}</div><div class="file">${a.path}</div><small>${a.use||''}</small></div>`).join('')}).catch(()=>grid.innerHTML='<p>Audit JSON could not be loaded.</p>')</script></body></html>

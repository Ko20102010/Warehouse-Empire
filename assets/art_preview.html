<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weapon Shop Empire v0.11.00 Art Preview</title><style>

</style></head><body><header><h1>Weapon Shop Empire v0.11.00</h1><p>Original slightly-pixelated art direction preview. This page previews product, material, customer, worker, monster, and environment categories before full sprite-sheet production.</p></header><main class="grid" id="grid"></main><script>

};

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weapon Shop Empire Art Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#18371f;color:#fff0c8;font-family:Arial}h1{padding:14px;margin:0;background:#2b2220;color:#ffd064}.grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#282225;border:2px solid #72563d;border-radius:12px;padding:10px;text-align:center}.icon{height:80px;display:grid;place-items:center;background:#3f7f3e;border-radius:8px;font-size:48px}.card b{display:block;color:#ffe09a;margin-top:7px}.card small{color:#c0ad92}.section{grid-column:1/-1;color:#ffd064;font-size:18px;font-weight:bold}</style></head><body><h1>Weapon Shop Empire • Original Art Preview</h1><main class="grid" id="g"></main><script>const x={'Attack':['⚔️ Iron Sword','🗡️ Slime Edge','🪓 Battle Axe','🏹 Forest Bow'],'Defense':['🛡️ Wooden Shield','🔰 Iron Shield','🪖 Guard Helmet','🥋 Leather Armor'],'Other':['🧪 Healing Potion','📜 Enchant Scroll','🔧 Repair Kit','🎒 Material Bag'],'Materials':['🪨 Iron Ore','🪵 Hardwood','🌿 Healing Herb','💧 Slime Gel'],'World':['🔥 Forge','⚗️ Alchemy','🧰 Output Table','🗄️ Retail Shelf','📦 Contract Crate','🟢 Forest Slime']};for(const[k,a]of Object.entries(x)){g.insertAdjacentHTML('beforeend',`<div class=section>${k}</div>`);for(const s of a){const [i,...n]=s.split(' ');g.insertAdjacentHTML('beforeend',`<div class=card><div class=icon>${i}</div><b>${n.join(' ')}</b><small>Original slightly-pixelated mobile-game direction</small></div>`)}}</script></body></html>

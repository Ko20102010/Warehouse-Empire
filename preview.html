<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WSE v0.16.00 Modular Assets</title><style>*{box-sizing:border-box}body{margin:0;background:#14231a;color:#fff3d0;font-family:Arial}header{padding:18px;background:#241d1b;position:sticky;top:0;z-index:2}h1{margin:0;color:#ffd064}.tabs{padding:10px 14px}.tabs button{margin:4px;padding:8px 12px;border:0;border-radius:8px;background:#583c27;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:14px}.card{background:#2a2828;border:1px solid #6e583d;border-radius:12px;padding:8px;text-align:center}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#315d35;border-radius:8px;image-rendering:pixelated}.card b{font-size:11px;word-break:break-word}</style></head><body><header><h1>Weapon Shop Empire v0.16.00</h1><p>Modular environment asset starter pack</p></header><div class="tabs" id="tabs"></div><main class="grid" id="grid"></main><script>fetch('assets/metadata/asset_manifest.json').then(r=>r.json()).then(m=>{let cats=[...new Set(m.assets.map(x=>x.category))];function show(c){grid.innerHTML='';m.assets.filter(x=>!c||x.category===c).forEach(x=>grid.insertAdjacentHTML('beforeend',`<div class=card><img src="assets/${x.file}"><b>${x.id}</b></div>`))}tabs.innerHTML='<button onclick="show()">ALL</button>'+cats.map(c=>`<button onclick="show('${c}')">${c.toUpperCase()}</button>`).join('');window.show=show;show()})</script></body></html>
